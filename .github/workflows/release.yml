name: Release

# Cria um release com os downloads (send.py, install.sh, install.ps1)
# automaticamente quando uma tag v* é enviada:
#   git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Criar release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            send.py install.sh install.ps1 \
            --repo "$GITHUB_REPOSITORY" \
            --title "SEND ${GITHUB_REF_NAME}" \
            --notes "## ⚡ SEND ${GITHUB_REF_NAME}

Assistente de IA no terminal (estilo Claude Code) conectado ao LM Studio.

### Instalação

**Linux / Pop!_OS / Ubuntu:**
\`\`\`bash
curl -fsSL https://github.com/contasuportedis-png/SEND/releases/latest/download/install.sh | bash
\`\`\`

**Windows (PowerShell):**
\`\`\`powershell
irm https://github.com/contasuportedis-png/SEND/releases/latest/download/install.ps1 | iex
\`\`\`

### Uso

\`\`\`bash
send                    # modo interativo (coding)
send \"pergunta\"         # resposta única
send --plan \"tarefa\"    # modo plano
send --thinking \"x\"     # com raciocínio (se o modelo suportar)
send --doctor            # diagnóstico da conexão com o LM Studio
\`\`\`"
