name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Testes (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rodar a suíte de testes
        run: bash tests/run_tests.sh

  windows:
    name: Smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sintaxe e versão
        shell: pwsh
        run: |
          python -m py_compile send.py
          python send.py --version
          python send.py --install
